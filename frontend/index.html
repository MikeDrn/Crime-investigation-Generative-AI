<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GenAI Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <a class="brand" href="/">GenAI Studio</a>
      <p class="sidebar-label" id="nav-label">Models</p>
      <nav id="service-nav" aria-labelledby="nav-label"></nav>
      <div class="key-status" id="key-status" role="status">Checking connection…</div>
    </aside>

    <main class="main">
      <header class="tool-header">
        <p class="tool-category" id="tool-category"></p>
        <h1 id="tool-title">Loading…</h1>
        <p class="tool-description" id="tool-description"></p>
      </header>
      <section id="tool" class="tool"></section>
    </main>
  </div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
